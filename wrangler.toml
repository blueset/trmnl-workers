name = "trmnl"
main = "src/index.ts"
compatibility_date = "2024-05-01"

[triggers]
crons = ["7,37 * * * *"]

[vars]
TRMNL_DATA_SOURCE = "146195"
TRMNL_SCHEDULE_TARGET = "679434"
SCHEDULE_PAD_MINUTES = "15"
SCHEDULE_UPDATER_DRY_RUN = "true"
# /oidc/token CORS proxy for the Holiday Editor (comma-separated lists; empty client IDs = any).
OIDC_PROXY_ALLOWED_ORIGINS = "https://blueset.github.io"
OIDC_PROXY_ALLOW_LOCALHOST = "true"
OIDC_PROXY_ALLOWED_CLIENT_IDS = ""

[[kv_namespaces]]
binding = "TRMNL_WORKERS_KV"
id = "bd9dad65430948879f23dfba951de218"

[observability]
[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true
